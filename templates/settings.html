{% extends "base.html" %}{% block title %}Settings{% endblock %}
{% block body %}
<form method="post" class="card inline-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="profile">
  <h3>Profile</h3>
  <label>Name <input name="name" required value="{{ user.name }}"></label>
  <p class="hint">Email: {{ user.email }} (cannot be changed in this version)</p>
  <button class="btn">Save profile</button>
</form>
<form method="post" class="card inline-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="password">
  <h3>Change password</h3>
  <label>Current password <input type="password" name="current_password" required></label>
  <label>New password (at least 8 characters) <input type="password" name="new_password" minlength="8" required></label>
  <button class="btn">Change password</button>
</form>
{% endblock %}
